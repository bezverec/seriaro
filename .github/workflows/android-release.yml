name: Android release draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/android-release.yml]

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Android tools
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$tools_archive" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          printf '%s  %s\n' 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 "$tools_archive" | sha256sum --check

          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$tools_archive" -d "$RUNNER_TEMP/android-command-line-tools"
          mv "$RUNNER_TEMP/android-command-line-tools/cmdline-tools" "$sdk_root/cmdline-tools/pinned"
          sdkmanager="$sdk_root/cmdline-tools/pinned/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-37.1' 'build-tools;36.0.0' 'ndk;28.2.13676358'

          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Test and build
        run: |
          cargo fmt --manifest-path core-rust/Cargo.toml --all --check
          cargo test --manifest-path core-rust/Cargo.toml --locked
          cargo clippy --manifest-path core-rust/Cargo.toml --locked --all-targets -- -D warnings
          ./android-app/gradlew --no-daemon :app:assembleRelease

      - name: Verify APK and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          package=$("$tools/aapt" dump badging "$apk" | sed -n '/^package: /p')
          [[ "$package" == "package: name='org.seriaro.android' "* ]]
          version=$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$package")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $tag."
            exit 0
          fi
          asset="seriaro-$version-unsigned.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Seriaro $version" \
            --notes "Unsigned Android build for review and release signing."
